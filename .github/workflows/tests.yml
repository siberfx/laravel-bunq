name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        prefer: [prefer-stable]

    name: PHP ${{ matrix.php }} / ${{ matrix.prefer }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.prefer }} --no-interaction --no-progress

      - name: Run tests
        run: composer test
